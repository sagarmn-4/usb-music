<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USB Music web player, settings preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Arimo:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--font:Arimo,Arial,sans-serif;--bg:#030303;--card:#212121;--line:#2b2b2b;--text:#fff;--muted:#aaa;--accent:#ff2a4d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#111;font-family:var(--font);color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:min(420px,100vw);height:min(860px,100vh);background:var(--bg);overflow:hidden;border-radius:28px;box-shadow:0 0 0 1px #2a2a2a,0 30px 90px rgba(0,0,0,.7)}
header{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.logo i{border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
header b{font-size:19px;font-weight:700;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:#fff;cursor:pointer}
.ib svg{width:24px;height:24px;fill:currentColor}
.tabs{display:flex;gap:8px;padding:8px 16px;overflow:hidden}
.tab{padding:7px 16px;border-radius:16px;background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.tab.on{background:#fff;color:#000}
.search{margin:6px 16px 10px;height:42px;border-radius:21px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted);font-size:15px}
.search svg{width:20px;height:20px;fill:currentColor}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px}
.th{width:52px;height:52px;border-radius:8px;flex:none}
.row .t{font-size:16px;font-weight:500}.row .s{font-size:13px;color:var(--muted);margin-top:2px}
.row .d{margin-left:auto;font-size:13px;color:var(--muted)}
.mini{position:absolute;left:0;right:0;bottom:0;height:64px;background:#1b1b1b;display:flex;align-items:center;gap:12px;padding:0 14px}
.mini .pr{position:absolute;left:0;top:0;height:2px;width:34%;background:var(--accent)}
.mini .th{width:44px;height:44px}
.mini .t{font-size:15px;font-weight:600}.mini .s{font-size:12px;color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#212121;border-radius:20px 20px 0 0;padding:10px 0 20px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:6}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#555;margin:0 auto 10px}
.mi{display:flex;align-items:center;gap:16px;padding:14px 22px;font-size:16px;cursor:pointer}
.mi svg{width:22px;height:22px;fill:#ccc}
.mi:active{background:#2c2c2c}
.page{position:absolute;inset:0;background:var(--bg);z-index:7;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.page.on{transform:none}
.page h2{font-size:20px;font-weight:700}
.ph{display:flex;align-items:center;gap:8px;padding:12px 8px 10px 8px}
.sec{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:18px 18px 8px;font-weight:600}
.opt{display:flex;align-items:center;gap:16px;margin:0 12px 8px;padding:14px 16px;border-radius:14px;background:#161616;cursor:pointer;border:1px solid transparent}
.opt.on{border-color:#555;background:#1d1d1d}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #777;flex:none;position:relative}
.opt.on .radio{border-color:#fff}.opt.on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.fn{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.tag{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:9px;background:#333;color:#ddd}
.fs{font-size:14px;color:#c8c8c8;margin-top:4px}
.note{font-size:13px;color:var(--muted);margin:10px 18px;line-height:1.45}
</style>
</head>
<body>
<div class="phone" id="phone">
  <header><div class="logo"><i></i></div><b>USB Music</b>
    <button class="ib" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg></button>
    <button class="ib" id="more" aria-label="More"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button></header>
  <div class="tabs"><div class="tab on">Folders</div><div class="tab">Albums</div><div class="tab">Songs</div><div class="tab">Artists</div></div>
  <div class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>Search songs, albums</div>
  <div id="rows"></div>
  <div class="mini"><div class="pr"></div><div class="th" style="background:linear-gradient(145deg,hsl(22 62% 52%),hsl(67 58% 26%))"></div><div><div class="t">Wildflower</div><div class="s">Meera Das · Evening Ragas</div></div></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="menu"><div class="grab"></div>
    <div class="mi"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>Rescan USB</div>
    <div class="mi"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm2 16H8v-2h8zm0-4H8v-2h8zm-3-5V3.5L18.5 9z"/></svg>Scan log</div>
    <div class="mi" id="openSettings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>Settings</div>
  </div>
  <div class="page" id="settings">
    <div class="ph"><button class="ib" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><h2>Settings</h2></div>
    <div class="sec">Font</div>
    <div id="opts"></div>
    <div class="note">Changes the font on this page. The TV screen has its own font setting.</div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const FOPTS=[
 {n:'Inter',st:'Inter,system-ui,sans-serif'},
 {n:'Arimo',st:'Arimo,Arial,sans-serif',def:1},
 {n:'Noto Sans',st:'"Noto Sans",system-ui,sans-serif'},
 {n:'DM Sans',st:'"DM Sans",system-ui,sans-serif'}];
let cur=1;
try{const v=localStorage.getItem('usbmusic.font');if(v!==null&&FOPTS[+v])cur=+v}catch(e){}
function apply(){document.documentElement.style.setProperty('--font',FOPTS[cur].st)}
function drawOpts(){$('#opts').innerHTML=FOPTS.map((f,i)=>`<div class="opt ${i===cur?'on':''}" data-i="${i}"><div class="radio"></div><div><div class="fn">${f.n}${f.def?'<span class="tag">Default</span>':''}</div><div class="fs" style="font-family:${f.st}">Aa &nbsp;Evening Ragas · Asha Rao</div></div></div>`).join('')}
const ROWS=[['Evening Ragas','9 songs',22],['Road Trip Hits','12 songs',200],['Classics','3 folders',280],['Acoustic Sessions','10 songs',145],['Old Recordings','11 songs',50]];
$('#rows').innerHTML=ROWS.map(r=>`<div class="row"><div class="th" style="background:linear-gradient(145deg,hsl(${r[2]} 62% 52%),hsl(${r[2]+45} 58% 26%))"></div><div><div class="t">${r[0]}</div><div class="s">${r[1]}</div></div></div>`).join('');
$('#more').onclick=()=>{$('#scrim').classList.add('on');$('#menu').classList.add('on')};
$('#scrim').onclick=()=>{$('#scrim').classList.remove('on');$('#menu').classList.remove('on')};
$('#openSettings').onclick=()=>{$('#scrim').classList.remove('on');$('#menu').classList.remove('on');drawOpts();$('#settings').classList.add('on')};
$('#back').onclick=()=>$('#settings').classList.remove('on');
$('#opts').onclick=e=>{const o=e.target.closest('.opt');if(!o)return;cur=+o.dataset.i;try{localStorage.setItem('usbmusic.font',cur)}catch(x){}apply();drawOpts()};
apply();
</script>
</body>
</html>
