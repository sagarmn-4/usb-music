plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sagar.usbmusic'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sagar.usbmusic'
        minSdk 26
        // Current target so Play Protect does not flag the app as built for an old Android.
        // Songs are read through MediaStore, which needs no legacy storage access.
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Draws the QR code on the TV screen.
    implementation 'com.google.zxing:core:3.5.3'
}
