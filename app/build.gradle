plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sagar.usbmusic'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sagar.usbmusic'
        minSdk 26
        // Stays at 29 so the app keeps plain file access to the USB drive.
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
