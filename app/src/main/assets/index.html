<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1018">
<title>USB Music</title>
<style>
:root{--bg:#0f0f0f;--card:#272727;--line:#2e2e2e;--text:#fff;--muted:#b3b3b3;--accent:#ff4e5b;--gray:#4a4a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.wrap{max-width:720px;margin:0 auto}

/* top bar */
#top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#3a1420 0%,#1a0e12 70%,var(--bg) 100%);padding:max(10px,env(safe-area-inset-top)) 16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;height:44px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.2px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff6b6b,#ff1f4b);color:#fff;display:grid;place-items:center}
.logo .ic{width:18px;height:18px}
.acts{display:flex}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.round:active{background:var(--card)}
#searchbar{display:flex;gap:8px;align-items:center;height:44px}
#q{flex:1;height:40px;border-radius:20px;border:0;background:var(--card);color:var(--text);padding:0 16px;font-size:16px;outline:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 16px;border-radius:17px;background:rgba(255,255,255,.12);color:var(--text);font-weight:500}
.chip.on{background:var(--text);color:var(--bg)}
#err{padding:6px 16px;color:#ff8a80;font-size:13px}
#count{padding:0 16px 6px;color:var(--muted);font-size:13px}

/* lists */
#view{padding:0 0 110px}
#msg{padding:40px 24px;color:var(--muted);text-align:center}
.actionrow{display:flex;gap:10px;padding:2px 16px 12px}
.btn{height:42px;padding:0 22px;border-radius:21px;background:var(--text);color:var(--bg);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:rgba(255,255,255,.14);color:var(--text)}
.btn .ic{width:20px;height:20px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 16px}
.row:active{background:var(--card)}
.row .meta{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.row.cur .t{color:var(--accent)}
.row .art{width:48px;height:48px}
.row.round-art .art{border-radius:50%}
.eq{display:none;gap:2px;align-items:flex-end;height:16px;width:16px}
.row.cur .eq{display:flex}
.eq i{flex:1;background:var(--accent);height:30%;border-radius:1px}
body.playing .row.cur .eq i{animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.6s!important}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:4px 16px}
.card{text-align:left;min-width:0}
.card .art{width:100%;border-radius:10px}
.card .t{margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{height:1px}

/* cover art placeholder + image */
.art{position:relative;overflow:hidden;border-radius:6px;aspect-ratio:1;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,hsl(var(--h,200) 62% 46%),hsl(calc(var(--h,200) + 45) 58% 27%))}
.art .ic{opacity:.6;color:#fff;width:42%;height:42%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.art.has img{opacity:1}

/* overlays */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s ease}
#detail{z-index:10;padding-bottom:110px;background:linear-gradient(180deg,#3a1420 0,var(--bg) 360px) no-repeat var(--bg)}
#detail .head{padding:max(10px,env(safe-area-inset-top)) 8px 0}
#detail .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 24px 16px}
#detail .hero .art{width:min(58vw,240px);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.45)}
#detail h2{margin:16px 0 2px;font-size:22px;overflow-wrap:anywhere}
#detail .sub{color:var(--muted);font-size:14px}
#detail .actionrow{justify-content:center;padding-top:14px}

/* mini player */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0 auto;max-width:720px;background:#2b2b2b;border-radius:14px 14px 0 0;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 12px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
#mini .art{width:44px;height:44px}
#mini .meta{flex:1;min-width:0;text-align:left}
#mini .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .prog{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:0;border-radius:2px}
#mini .round{width:44px;height:44px}

/* full player */
#player{z-index:30;background:linear-gradient(180deg,#4a1426 0%,#1c0f14 55%,var(--bg) 100%);display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));overflow:hidden}
#pbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(46px) saturate(1.3);opacity:.45;transform:scale(1.2);pointer-events:none}
#player>*{position:relative}
#player .top{display:flex;justify-content:space-between;align-items:center;height:44px;margin:0 -10px}
#player .label{font-size:13px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
#pstage{flex:1;display:grid;place-items:center;min-height:0;padding:8px 0}
#pstage .art{width:min(100%,46vh,420px);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#ptitle{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#psub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--gray) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--gray)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px}
.ctl .round{width:52px;height:52px;color:var(--muted)}
.ctl .round.on{color:var(--accent)}
.ctl .round.skip{color:var(--text)}
.ctl .round.skip .ic{width:34px;height:34px}
.ctl .main{width:68px;height:68px;border-radius:50%;background:#fff;color:var(--bg);display:grid;place-items:center}
.ctl .main .ic{width:36px;height:36px}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:10px;font-size:13px}
.vol .ic{width:20px;height:20px}

/* menu + log */
#menu{position:fixed;top:54px;right:12px;z-index:40;background:#2b2b2b;border-radius:12px;padding:6px 0;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#menu button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;text-align:left}
#menu button:active{background:var(--card)}
#scrim{position:fixed;inset:0;z-index:35}
#log{margin:0 16px 110px;padding:12px;border-radius:12px;background:var(--card);color:var(--muted);white-space:pre-wrap;font-size:12px}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const icon = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const setIcon = (el, n) => { el.innerHTML = icon(n); };

let lib = {ver: -1, tracks: []};
let idx = {albums: [], artists: [], folders: []};
let st = {};
let tab = 'songs';
let detail = null;           // {title, sub, ids, scope, artId}
let query = '';
let seeking = false, volDrag = false, loadingLib = false;
const noArt = new Set();
let shownId = -2, shownPlaying = null;

async function api(p) {
  const r = await fetch('/api/' + p, {cache: 'no-store'});
  return r.json();
}
function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
const primary = a => (a || '').split(/,\s|;/)[0].trim();
const sub = t => [t[2], t[3]].filter(Boolean).join(' · ');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

/* ---------- cover art ---------- */
function makeArt(id, extra) {
  const d = document.createElement('div');
  d.className = 'art' + (extra ? ' ' + extra : '');
  d.innerHTML = icon('note');
  const t = lib.tracks[id];
  if (!t) return d;
  const key = t[3] ? t[1] + '|' + t[3] : '#' + id;
  d.style.setProperty('--h', hash(key) % 360);
  if (!noArt.has(key)) {
    const img = new Image();
    img.alt = ''; img.decoding = 'async'; img.loading = 'lazy';
    img.onload = () => d.classList.add('has');
    img.onerror = () => { noArt.add(key); img.remove(); };
    img.src = '/art?id=' + id + '&v=' + lib.ver;
    d.append(img);
  }
  return d;
}
function artUrl(id) { return '/art?id=' + id + '&v=' + lib.ver; }

/* ---------- library ---------- */
async function loadLib() {
  if (loadingLib) return;
  loadingLib = true;
  try {
    lib = await api('library');
    noArt.clear();
    buildIndex();
    render();
    shownId = -2;
    applyState(st);
  } finally { loadingLib = false; }
}

// Folder tree for the Folders tab. A leading "Music" folder is dropped; songs sitting directly
// in it have no folder name to show, so they stay out of this tab.
function addToTree(root, folder, id) {
  const orig = folder.split('/').filter(Boolean);
  const skip = orig.length && orig[0].toLowerCase() === 'music' ? 1 : 0;
  let n = root;
  for (let i = skip; i < orig.length; i++) {
    let c = n.children.get(orig[i]);
    if (!c) {
      c = {name: orig[i], full: orig.slice(0, i + 1).join('/'), parent: n.name ? n : null,
           children: new Map(), ids: [], all: []};
      n.children.set(orig[i], c);
    }
    n = c;
    n.all.push(id);
  }
  if (n !== root) n.ids.push(id);
}
const byName = (a, b) => a.name.localeCompare(b.name, undefined, {sensitivity: 'base', numeric: true});
const sortedKids = n => [...n.children.values()].sort(byName);
function flattenTree(n, out = []) {
  for (const c of sortedKids(n)) { out.push(c); flattenTree(c, out); }
  return out;
}
function relPath(n) {
  const parts = [];
  for (let p = n.parent; p; p = p.parent) parts.unshift(p.name);
  return parts.join(' / ');
}

function buildIndex() {
  const albums = new Map(), artists = new Map();
  const tree = {name: '', children: new Map(), ids: [], all: []};
  lib.tracks.forEach((t, id) => {
    const [, folder, artist, album] = t;
    const pa = primary(artist);
    if (album) {
      const k = album + '\n' + folder;
      let a = albums.get(k);
      if (!a) { a = {name: album, artist: pa, folder, ids: []}; albums.set(k, a); }
      else if (a.artist !== pa) a.artist = 'Various artists';
      a.ids.push(id);
    }
    if (pa) {
      let a = artists.get(pa);
      if (!a) { a = {name: pa, ids: []}; artists.set(pa, a); }
      a.ids.push(id);
    }
    addToTree(tree, folder, id);
  });
  idx = {
    albums: [...albums.values()].sort(byName),
    artists: [...artists.values()].sort(byName),
    tree,
    folderNodes: flattenTree(tree),
  };
}

/* ---------- rendering ---------- */
// Adds items in slices so a 5,000 song list does not freeze the phone.
function fill(container, items, make, onDone) {
  let n = 0;
  const step = 80;
  const sentinel = document.createElement('div');
  sentinel.className = 'more';
  const obs = 'IntersectionObserver' in window
    ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, {rootMargin: '600px'})
    : null;
  function more() {
    const frag = document.createDocumentFragment();
    const end = Math.min(items.length, n + step);
    for (; n < end; n++) frag.append(make(items[n], n));
    container.insertBefore(frag, sentinel);
    if (n >= items.length) { obs && obs.disconnect(); sentinel.remove(); }
  }
  container.append(sentinel);
  more();
  if (obs && n < items.length) obs.observe(sentinel);
  else while (n < items.length) more();
  onDone && onDone();
}

function songRow(id, scope) {
  const t = lib.tracks[id];
  const b = document.createElement('button');
  b.className = 'row'; b.dataset.id = id;
  b.append(makeArt(id));
  const m = document.createElement('div'); m.className = 'meta';
  const a = document.createElement('div'); a.className = 't'; a.textContent = t[0];
  const s = document.createElement('div'); s.className = 's'; s.textContent = sub(t) || t[1].split('/').pop();
  m.append(a, s);
  const eq = document.createElement('span'); eq.className = 'eq'; eq.innerHTML = '<i></i><i></i><i></i>';
  b.append(m, eq);
  b.onclick = () => play(id, scope);
  return b;
}

function groupRow(g, kind) {
  const b = document.createElement('button');
  b.className = 'row' + (kind === 'artist' ? ' round-art' : '');
  b.append(makeArt(g.ids[0]));
  const m = document.createElement('div'); m.className = 'meta';
  const a = document.createElement('div'); a.className = 't'; a.textContent = g.name;
  const s = document.createElement('div'); s.className = 's'; s.textContent = plural(g.ids.length, 'song');
  m.append(a, s);
  b.append(m);
  b.onclick = () => openDetail({title: g.name, sub: plural(g.ids.length, 'song'), ids: g.ids, scope: kind});
  return b;
}

function folderRow(n, withPath) {
  const b = document.createElement('button');
  b.className = 'row';
  b.append(makeArt(n.all[0]));
  const m = document.createElement('div'); m.className = 'meta';
  const a = document.createElement('div'); a.className = 't'; a.textContent = n.name;
  const s = document.createElement('div'); s.className = 's';
  const bits = [];
  if (n.children.size) bits.push(plural(n.children.size, 'folder'));
  bits.push(plural(n.all.length, 'song'));
  s.textContent = (withPath && relPath(n) ? relPath(n) + ' \u00b7 ' : '') + bits.join(' \u00b7 ');
  m.append(a, s);
  b.append(m);
  b.onclick = () => openDetail({
    title: n.name, sub: bits.join(' \u00b7 '), ids: n.ids, allIds: n.all,
    children: sortedKids(n), scope: 'folder', treePath: n.full,
  });
  return b;
}

function albumCard(a) {
  const b = document.createElement('button');
  b.className = 'card';
  b.append(makeArt(a.ids[0]));
  const t = document.createElement('div'); t.className = 't'; t.textContent = a.name;
  const s = document.createElement('div'); s.className = 's'; s.textContent = a.artist || plural(a.ids.length, 'song');
  b.append(t, s);
  b.onclick = () => openDetail({title: a.name, sub: [a.artist, plural(a.ids.length, 'song')].filter(Boolean).join(' · '), ids: a.ids, scope: 'album'});
  return b;
}

function render() {
  const view = $('#view');
  view.textContent = '';
  const q = query.trim().toLowerCase();
  const has = (...xs) => !q || xs.some(x => (x || '').toLowerCase().includes(q));
  let shown = 0;

  if (tab === 'songs') {
    const ids = [];
    lib.tracks.forEach((t, id) => { if (has(t[0], t[1], t[2], t[3])) ids.push(id); });
    shown = ids.length;
    if (!q && ids.length) {
      const r = document.createElement('div'); r.className = 'actionrow';
      r.innerHTML = '<button class="btn" id="playAll">' + icon('play') + 'Play all</button><button class="btn ghost" id="shufAll">' + icon('shuffle') + 'Shuffle</button>';
      view.append(r);
      r.querySelector('#playAll').onclick = () => { cmd('shuffle?on=0').then(() => play(0, 'all')); };
      r.querySelector('#shufAll').onclick = () => shufflePlay(ids, 'all');
    }
    const list = document.createElement('div');
    view.append(list);
    fill(list, ids, id => songRow(id, 'all'));
  } else if (tab === 'albums') {
    const items = idx.albums.filter(a => has(a.name, a.artist));
    shown = items.length;
    const g = document.createElement('div'); g.className = 'grid';
    view.append(g);
    fill(g, items, albumCard);
  } else if (tab === 'artists') {
    const items = idx.artists.filter(a => has(a.name));
    shown = items.length;
    const l = document.createElement('div'); view.append(l);
    fill(l, items, a => groupRow(a, 'artist'));
  } else {
    const items = q ? idx.folderNodes.filter(f => has(f.name)) : sortedKids(idx.tree);
    shown = items.length;
    const l = document.createElement('div'); view.append(l);
    fill(l, items, f => folderRow(f, !!q));
  }

  if (!shown) {
    const m = document.createElement('div'); m.id = 'msg';
    m.textContent = lib.tracks.length
      ? 'No match.'
      : (st.scanning ? 'Scanning the USB drive…' : 'No music found. Check the USB drive is plugged into the TV, then choose Rescan USB from the menu. "Scan log" shows what the TV saw.');
    view.append(m);
  }
  markCurrent();
}

/* ---------- detail screen ---------- */
const detailStack = [];
function openDetail(d) {
  detailStack.push(d);
  showDetail(d);
  $('#detail').classList.add('open');
  history.pushState({l: 'd'}, '');
}

function showDetail(d) {
  const all = d.allIds || d.ids;
  const hero = $('#hero');
  hero.textContent = '';
  hero.append(makeArt(all[0]));
  const h = document.createElement('h2'); h.textContent = d.title;
  const s = document.createElement('div'); s.className = 'sub'; s.textContent = d.sub;
  const r = document.createElement('div'); r.className = 'actionrow';
  r.innerHTML = '<button class="btn">' + icon('play') + 'Play</button><button class="btn ghost">' + icon('shuffle') + 'Shuffle</button>';
  const scope = d.treePath ? 'tree' : d.scope;
  r.children[0].onclick = () => cmd('shuffle?on=0').then(() => play(all[0], scope, d.treePath));
  r.children[1].onclick = () => shufflePlay(all, scope, d.treePath);
  hero.append(h, s, r);
  const list = $('#detailList');
  list.textContent = '';
  if (d.children && d.children.length) {
    const kids = document.createElement('div');
    list.append(kids);
    fill(kids, d.children, n => folderRow(n, false));
  }
  const songs = document.createElement('div');
  list.append(songs);
  fill(songs, d.ids, id => songRow(id, d.scope));
  $('#detail').scrollTop = 0;
  markCurrent();
}

/* ---------- playback state ---------- */
let lastMark = '';
function markCurrent() {
  const key = st.id + '|' + st.playing;
  document.body.classList.toggle('playing', !!st.playing);
  for (const b of document.querySelectorAll('.row[data-id]')) {
    b.classList.toggle('cur', Number(b.dataset.id) === st.id);
  }
  lastMark = key;
}

function setRange(el, val, max) {
  el.max = max; el.value = val;
  el.style.setProperty('--p', (max > 0 ? val / max * 100 : 0) + '%');
}

function applyState(s) {
  if (!s || s.error === 'unknown command') return;
  const prevId = st.id;
  st = s;
  if (s.ver !== lib.ver) loadLib();
  $('#count').textContent = s.scanning ? 'Scanning…' : plural(s.count, 'song');
  $('#err').textContent = s.error || '';

  const has = s.id >= 0 && !!s.title;
  $('#mini').hidden = !has && !s.loading;
  const subline = [s.artist, s.album].filter(Boolean).join(' · ') || s.folder || '';
  $('#mtitle').textContent = s.title || 'Loading…';
  $('#msub').textContent = subline;
  $('#ptitle').textContent = s.title || 'Nothing playing';
  $('#psub').textContent = subline;

  if (s.id !== shownId && lib.tracks.length) {
    shownId = s.id;
    const w = $('#martWrap'); w.textContent = ''; w.append(makeArt(s.id));
    const st2 = $('#pstage'); st2.textContent = ''; st2.append(makeArt(s.id));
    $('#pbg').style.backgroundImage = s.id >= 0 ? 'url(' + artUrl(s.id) + ')' : '';
  }

  const pl = !!s.playing;
  setIcon($('#mtoggle'), pl ? 'pause' : 'play');
  setIcon($('#toggle'), pl ? 'pause' : 'play');
  $('#shuf').classList.toggle('on', s.shuffle);
  const rep = $('#rep');
  rep.classList.toggle('on', s.repeat !== 'off');
  setIcon(rep, s.repeat === 'one' ? 'repeat1' : 'repeat');
  $('#mprog').style.width = (s.dur > 0 ? s.pos / s.dur * 100 : 0) + '%';
  if (!seeking) {
    setRange($('#seek'), s.pos, s.dur);
    $('#t0').textContent = fmt(s.pos);
  }
  $('#t1').textContent = fmt(s.dur);
  if (!volDrag) setRange($('#vol'), s.vol, s.maxVol);
  if (prevId !== s.id || lastMark !== s.id + '|' + s.playing) markCurrent();
  syncSession(s);
}

/* ---------- phone lock-screen / notification controls ----------
   The music plays on the TV, so the phone browser has no audio of its own. A silent looping
   clip keeps a media session alive; the browser then shows its media notification, and we
   fill that with the TV's track and send its buttons to the TV. Starts on the first tap. */
let silent = null, sessionOn = false, sessionId = -2, holdUntil = 0;

function silentWav() {
  const rate = 8000, n = rate * 10;
  const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  str(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128 + (i & 1)); // inaudible
  return URL.createObjectURL(new Blob([buf], {type: 'audio/wav'}));
}

function startSession() {
  if (sessionOn || !('mediaSession' in navigator)) return;
  sessionOn = true;
  silent = new Audio(silentWav());
  silent.loop = true;
  silent.play().catch(() => { sessionOn = false; });
  const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  // The silent clip must mirror the TV: if it kept playing while the TV is paused, the
  // notification would show a Pause button and the Play tap would never arrive.
  on('play', () => { holdUntil = Date.now() + 2000; silent.play().catch(() => {}); if (!st.playing) cmd('toggle'); });
  on('pause', () => { holdUntil = Date.now() + 2000; silent.pause(); if (st.playing) cmd('toggle'); });
  on('nexttrack', () => cmd('next'));
  on('previoustrack', () => cmd('prev'));
  on('seekto', d => cmd('seek?ms=' + Math.round(d.seekTime * 1000)));
  on('seekforward', () => cmd('seek?ms=' + Math.min(st.dur, st.pos + 10000)));
  on('seekbackward', () => cmd('seek?ms=' + Math.max(0, st.pos - 10000)));
  sessionId = -2;
  syncSession(st);
}
document.addEventListener('pointerdown', startSession, {passive: true});

function syncSession(s) {
  if (!sessionOn) return;
  const ms = navigator.mediaSession;
  if (Date.now() > holdUntil) {
    if (s.playing && silent.paused) silent.play().catch(() => {});
    else if (!s.playing && !silent.paused) silent.pause();
  }
  if (s.id !== sessionId) {
    sessionId = s.id;
    ms.metadata = s.id >= 0 && s.title
      ? new MediaMetadata({
          title: s.title,
          artist: s.artist || '',
          album: s.album || s.folder || '',
          artwork: [{src: new URL(artUrl(s.id), location.href).href, sizes: '512x512', type: 'image/jpeg'}],
        })
      : null;
  }
  ms.playbackState = s.id < 0 ? 'none' : (s.playing ? 'playing' : 'paused');
  if (s.dur > 0) {
    try { ms.setPositionState({duration: s.dur / 1000, position: Math.min(s.pos, s.dur) / 1000, playbackRate: 1}); } catch (e) {}
  }
}

const cmd = p => api(p).then(applyState).catch(() => { $('#err').textContent = 'Cannot reach the TV'; });
const play = (id, scope, path) => cmd('play?id=' + id + '&scope=' + scope + (path ? '&path=' + encodeURIComponent(path) : ''));
function shufflePlay(ids, scope, path) {
  if (!ids.length) return;
  const id = ids[Math.floor(Math.random() * ids.length)];
  return cmd('shuffle?on=1').then(() => play(id, scope, path));
}

/* ---------- wiring ---------- */
for (const c of document.querySelectorAll('.chip')) {
  c.onclick = () => {
    tab = c.dataset.tab;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    $('#log').hidden = true;
    render();
    window.scrollTo(0, 0);
  };
}
$('#btnSearch').onclick = () => {
  $('#bar').hidden = true; $('#searchbar').hidden = false; $('#q').focus();
};
$('#btnQx').onclick = () => {
  query = ''; $('#q').value = '';
  $('#searchbar').hidden = true; $('#bar').hidden = false;
  render();
};
$('#q').addEventListener('input', e => { query = e.target.value; render(); });

const menu = $('#menu'), scrim = $('#scrim');
const closeMenu = () => { menu.hidden = true; scrim.hidden = true; };
$('#btnMenu').onclick = () => { menu.hidden = false; scrim.hidden = false; };
scrim.onclick = closeMenu;
$('#mRescan').onclick = () => { closeMenu(); cmd('rescan'); };
$('#mLog').onclick = async () => {
  closeMenu();
  const d = $('#log');
  if (!d.hidden) { d.hidden = true; return; }
  const j = await api('debug');
  d.textContent = 'TV address: ' + j.ip + ':' + j.port + '\n' + j.log;
  d.hidden = false;
  d.scrollIntoView({behavior: 'smooth'});
};

$('#mopen').onclick = () => {
  $('#player').classList.add('open');
  history.pushState({l: 'p'}, '');
};
$('#pclose').onclick = () => history.back();
$('#detailBack').onclick = () => history.back();
window.addEventListener('popstate', () => {
  if ($('#player').classList.contains('open')) $('#player').classList.remove('open');
  else if (detailStack.length > 1) { detailStack.pop(); showDetail(detailStack[detailStack.length - 1]); }
  else if ($('#detail').classList.contains('open')) { detailStack.length = 0; $('#detail').classList.remove('open'); }
});

$('#toggle').onclick = $('#mtoggle').onclick = () => cmd('toggle');
$('#next').onclick = $('#mnext').onclick = () => cmd('next');
$('#prev').onclick = () => cmd('prev');
$('#shuf').onclick = () => cmd('shuffle?on=' + (st.shuffle ? 0 : 1));
$('#rep').onclick = () => cmd('repeat?mode=' + ({off: 'all', all: 'one', one: 'off'}[st.repeat] || 'all'));

$('#seek').addEventListener('input', e => {
  seeking = true;
  setRange(e.target, +e.target.value, +e.target.max);
  $('#t0').textContent = fmt(+e.target.value);
});
$('#seek').addEventListener('change', e => { cmd('seek?ms=' + e.target.value).then(() => { seeking = false; }); });
$('#vol').addEventListener('input', e => { volDrag = true; setRange(e.target, +e.target.value, +e.target.max); });
$('#vol').addEventListener('change', e => { cmd('volume?v=' + e.target.value).then(() => { volDrag = false; }); });

function poll() { api('state').then(applyState).catch(() => { $('#err').textContent = 'Cannot reach the TV'; }); }
render();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
